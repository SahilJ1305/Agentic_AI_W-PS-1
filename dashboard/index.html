<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadence</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #6b645c;
      --line: #ddd6cb;
      --card: #fffdf9;
      --pending: #8a8175;
      --progress: #1d4e89;
      --blocked: #9a3412;
      --complete: #1f6b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-end;
      padding: 20px 24px 12px;
    }
    h1 { font-size: 22px; margin: 0; font-weight: 650; }
    h2 { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 10px; color: var(--muted); }
    button, select, input {
      font: inherit;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .live { font-size: 12px; }
    .live.on { color: var(--complete); }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 8px 24px 28px; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .column { min-height: 240px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--pending);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .card.pending { border-left-color: var(--pending); }
    .card.in_progress { border-left-color: var(--progress); }
    .card.blocked { border-left-color: var(--blocked); }
    .card.complete { border-left-color: var(--complete); }
    .key { font-weight: 650; }
    .title { margin: 2px 0 6px; }
    .meta { font-size: 12px; color: var(--muted); }
    .side { display: flex; flex-direction: column; gap: 16px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    .feed { max-height: 420px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
    .event { font-size: 13px; }
    .event strong { font-weight: 650; }
    form { display: flex; flex-direction: column; gap: 8px; }
    @media (max-width: 980px) {
      main, .board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="project-name">Cadence</h1>
      <p class="muted" id="summary">Loading the board…</p>
    </div>
    <div class="row">
      <span class="live" id="live">connecting</span>
      <button id="checkin" class="primary" type="button">Check in with everyone</button>
    </div>
  </header>
  <main>
    <section class="board" id="board"></section>
    <aside class="side">
      <section class="panel">
        <h2>People</h2>
        <div id="people" class="feed"></div>
      </section>
      <section class="panel">
        <h2>Activity</h2>
        <div id="feed" class="feed"></div>
      </section>
      <section class="panel">
        <h2>Lead override</h2>
        <form id="override-form">
          <select id="override-task"></select>
          <select id="override-status">
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="blocked">Blocked</option>
            <option value="complete">Complete</option>
          </select>
          <select id="override-owner"></select>
          <input id="override-reason" placeholder="Reason" required />
          <button type="submit">Save override</button>
          <p class="muted" id="override-note"></p>
        </form>
      </section>
      <section class="panel">
        <h2>Upload a spec</h2>
        <form id="upload-form">
          <input id="project-field" placeholder="New project name" />
          <input id="file" type="file" accept=".md,.txt,.markdown" />
          <button type="submit">Create project from this spec</button>
          <p class="muted" id="upload-note"></p>
        </form>
      </section>
    </aside>
  </main>
  <script>
    const COLUMNS = [
      ["pending", "Pending"],
      ["in_progress", "In progress"],
      ["blocked", "Blocked"],
      ["complete", "Complete"],
    ];
    let projectId = null;
    let source = null;
    let latestTasks = [];
    let latestPeople = [];

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    async function loadProjects() {
      const response = await fetch("/api/projects");
      const projects = await response.json();
      const active = projects.find((item) => item.status === "active") || projects[0];
      projectId = active ? active.id : null;
      document.getElementById("project-name").textContent = active ? active.name : "Cadence";
      if (!projectId) {
        document.getElementById("summary").textContent = "No project yet. Upload docs/demo-spec.md to seed FestPass.";
        document.getElementById("board").innerHTML = "";
        return;
      }
      await refresh();
      connect();
    }

    async function refresh() {
      const [tasks, people, events, summary] = await Promise.all([
        fetch(`/api/projects/${projectId}/tasks`).then((r) => r.json()),
        fetch(`/api/projects/${projectId}/participants`).then((r) => r.json()),
        fetch(`/api/projects/${projectId}/events`).then((r) => r.json()),
        fetch(`/api/projects/${projectId}`).then((r) => r.json()),
      ]);
      const counts = summary.task_counts || {};
      document.getElementById("summary").textContent =
        `${summary.total_tasks} tasks · ${counts.complete || 0} complete · ${counts.blocked || 0} blocked · ${summary.open_blockers} open blockers`;
      latestTasks = tasks;
      latestPeople = people;
      renderBoard(tasks);
      renderPeople(people);
      renderFeed(events);
      renderOverride(tasks, people);
    }

    function renderBoard(tasks) {
      const board = document.getElementById("board");
      board.innerHTML = COLUMNS.map(([status, label]) => {
        const cards = tasks.filter((task) => task.status === status).map((task) => {
          const waiting = task.readiness === "waiting" ? "Waiting on an upstream task" : "Ready";
          const blocker = task.blocker ? `<div class="meta">Blocker: ${esc(task.blocker)}</div>` : "";
          const ask = status === "complete" ? "" :
            `<button type="button" data-followup="${task.id}">Ask ${esc(task.owner_name || "owner")}</button>`;
          return `<article class="card ${status}">
            <div class="key">${esc(task.key)} · ${esc(task.owner_name || "Unassigned")}</div>
            <div class="title">${esc(task.title)}</div>
            <div class="meta">${esc(waiting)}</div>
            ${blocker}
            ${ask}
          </article>`;
        }).join("");
        return `<div class="column"><h2>${label}</h2>${cards || '<p class="muted">None</p>'}</div>`;
      }).join("");
      board.querySelectorAll("[data-followup]").forEach((button) => {
        button.addEventListener("click", async () => {
          await fetch(`/api/tasks/${button.dataset.followup}/follow-up`, { method: "POST" });
          pushLocal("Follow-up queued.");
        });
      });
    }

    function renderOverride(tasks, people) {
      const taskSelect = document.getElementById("override-task");
      const ownerSelect = document.getElementById("override-owner");
      const previous = taskSelect.value;
      taskSelect.innerHTML = tasks.map((task) =>
        `<option value="${task.id}">${esc(task.key)} · ${esc(task.title)}</option>`
      ).join("");
      if (previous) taskSelect.value = previous;
      ownerSelect.innerHTML = `<option value="">Keep owner</option>` + people.map((person) =>
        `<option value="${person.id}">${esc(person.name)}</option>`
      ).join("");
      const selected = tasks.find((task) => String(task.id) === taskSelect.value) || tasks[0];
      if (selected) document.getElementById("override-status").value = selected.status;
    }

    function renderPeople(people) {
      document.getElementById("people").innerHTML = people.map((person) => {
        const state = person.telegram_chat_id ? "on Telegram" : "not joined";
        const link = person.deep_link
          ? `<div class="meta"><a href="${esc(person.deep_link)}">${esc(person.deep_link)}</a></div>`
          : "";
        return `<div class="event"><strong>${esc(person.name)}</strong> · ${esc(person.role)} · ${state}${link}</div>`;
      }).join("");
    }

    function renderFeed(events) {
      document.getElementById("feed").innerHTML = events.slice(0, 30).map((event) => (
        `<div class="event"><strong>${esc(event.task_key || "")}</strong> ${esc(event.event_type)} ${esc(event.old_value || "")} → ${esc(event.new_value || "")}<div class="meta">${esc(event.reason || "")}</div></div>`
      )).join("") || '<p class="muted">No changes yet.</p>';
    }

    function pushLocal(text) {
      const feed = document.getElementById("feed");
      const row = document.createElement("div");
      row.className = "event";
      row.textContent = text;
      feed.prepend(row);
    }

    function connect() {
      if (source) source.close();
      source = new EventSource(`/api/projects/${projectId}/stream`);
      const live = document.getElementById("live");
      source.onopen = () => { live.textContent = "live"; live.className = "live on"; };
      source.onerror = () => { live.textContent = "reconnecting"; live.className = "live"; };
      const onChange = () => refresh().catch(() => {});
      ["task.updated", "blocker.raised", "blocker.resolved", "interpretation", "message.in"].forEach((name) => {
        source.addEventListener(name, onChange);
      });
    }

    document.getElementById("override-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const note = document.getElementById("override-note");
      const task = latestTasks.find((item) => String(item.id) === document.getElementById("override-task").value);
      if (!task) return;
      const ownerValue = document.getElementById("override-owner").value;
      const response = await fetch(`/api/tasks/${task.id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          status: document.getElementById("override-status").value,
          owner_id: ownerValue ? Number(ownerValue) : null,
          reason: document.getElementById("override-reason").value,
          expected_version: task.version,
        }),
      });
      const body = await response.json();
      note.textContent = response.ok ? "Saved. The owner is notified if they are on Telegram." : (body.detail || "Override failed.");
      if (response.ok) await refresh();
    });

    document.getElementById("checkin").addEventListener("click", async () => {
      if (!projectId) return;
      const response = await fetch("/api/admin/checkin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ project_id: projectId }),
      });
      const body = await response.json();
      pushLocal(response.ok ? `Check-in queued for ${body.tasks_targeted} task(s).` : "Check-in failed.");
    });

    document.getElementById("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const note = document.getElementById("upload-note");
      const file = document.getElementById("file").files[0];
      const name = document.getElementById("project-field").value.trim() || "FestPass";
      if (!file) {
        note.textContent = "Choose a markdown spec first.";
        return;
      }
      const created = await fetch("/api/projects", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const project = await created.json();
      const body = new FormData();
      body.append("kind", "spec");
      body.append("file", file);
      const uploaded = await fetch(`/api/projects/${project.id}/documents`, { method: "POST", body });
      const result = await uploaded.json();
      note.textContent = uploaded.ok
        ? `Stored the original spec. Imported ${result.imported?.tasks || 0} tasks.`
        : (result.detail || "Upload failed.");
      await loadProjects();
    });

    loadProjects().catch((error) => {
      document.getElementById("summary").textContent = String(error);
    });
  </script>
</body>
</html>
